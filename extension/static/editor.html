<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New bug report · UpTrack</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="logo">U</span>
      <strong>New bug report</strong>
      <span id="page-host" class="muted small"></span>
      <div class="topbar-actions">
        <div id="progress" class="progress" hidden><div id="progress-bar"></div></div>
        <button type="submit" form="form" class="btn btn-primary" id="submit">Create bug</button>
      </div>
    </header>

    <main class="layout">
      <section class="report">
        <div class="media">
          <div id="tools" class="toolbar" hidden>
            <div class="group" role="radiogroup" aria-label="Tool">
              <button type="button" class="tool active" data-tool="arrow" title="Draw an arrow (A)">Arrow</button>
              <button type="button" class="tool" data-tool="rect" title="Draw a box (B)">Box</button>
              <button type="button" class="tool" data-tool="text" title="Click to add text (T)">Text</button>
              <button type="button" class="tool" data-tool="blur" title="Hide sensitive information (H)">Blur</button>
            </div>
            <div class="group" role="radiogroup" aria-label="Color" id="colors"></div>
            <div class="group push">
              <button type="button" class="btn btn-sm" id="undo" disabled title="Undo (Ctrl/Cmd+Z)">Undo</button>
              <button type="button" class="btn btn-sm" id="clear" disabled>Clear all</button>
            </div>
          </div>

          <div id="stage" class="stage">
            <div id="canvas-wrap" class="canvas-wrap" hidden>
              <canvas id="canvas"></canvas>
              <textarea id="text-input" class="text-input" rows="1" hidden></textarea>
            </div>
            <!-- The video with its trimmer laid over its bottom edge. -->
            <div id="player" class="player" hidden>
              <video id="video" playsinline></video>
              <!-- Drag the green handles to choose the part viewers see; the full recording is kept. -->
              <div id="trim" class="trim" hidden>
                <button type="button" class="trim-play" id="trim-play" aria-label="Play">
                  <svg class="icon-play" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.2v11.6L15.5 10 6 4.2Z" /></svg>
                  <svg class="icon-pause" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4.5" width="3" height="11" rx="1" /><rect x="11.5" y="4.5" width="3" height="11" rx="1" /></svg>
                </button>
                <button type="button" class="trim-play" id="trim-mark" title="Add a timestamp: where the bug shows up (M)" aria-label="Add a timestamp">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17.5V3" /><path d="M5 3.5h9.5l-2 3.5 2 3.5H5" /></svg>
                </button>
                <div class="trim-track" id="trim-track">
                  <canvas class="trim-film" id="trim-film"></canvas>
                  <div class="trim-shade" id="trim-shade-start"></div>
                  <div class="trim-shade end" id="trim-shade-end"></div>
                  <div class="trim-range" id="trim-range"></div>
                  <div class="trim-marks" id="trim-marks"></div>
                  <div class="trim-handle start" id="trim-start" role="slider" tabindex="0" aria-label="Trim start"><svg viewBox="0 0 4 14" aria-hidden="true"><circle cx="2" cy="2" r="1.5" /><circle cx="2" cy="7" r="1.5" /><circle cx="2" cy="12" r="1.5" /></svg></div>
                  <div class="trim-handle end" id="trim-end" role="slider" tabindex="0" aria-label="Trim end"><svg viewBox="0 0 4 14" aria-hidden="true"><circle cx="2" cy="2" r="1.5" /><circle cx="2" cy="7" r="1.5" /><circle cx="2" cy="12" r="1.5" /></svg></div>
                  <div class="trim-playhead" id="trim-playhead"></div>
                </div>
              </div>
            </div>
            <p id="load-error" class="notice" hidden></p>
          </div>

          <!-- Recordings: the timestamps marked in them, in a collapsible row with a tab for each. -->
          <div id="stamps" class="stamps" hidden>
            <button type="button" class="stamps-toggle" id="stamps-toggle" aria-expanded="false" aria-controls="stamps-body">
              <span>Timestamp <span class="count" id="count-timestamps"></span></span>
              <svg class="stamps-arrow" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" /></svg>
            </button>
            <div class="stamps-body" id="stamps-body" hidden>
              <div class="stamps-tabs" id="stamps-tabs" role="tablist" aria-label="Timestamps"></div>
              <div class="stamps-panel" id="stamps-panel" role="tabpanel"></div>
            </div>
          </div>
        </div>

        <form id="form" class="report-form">
          <input id="title" class="title-input" maxlength="300" placeholder="What went wrong?" aria-label="Title" required />
          <textarea
            id="description"
            class="description-input"
            rows="2"
            placeholder="Steps to reproduce, what you expected, what happened"
            aria-label="Description"
          ></textarea>
          <div class="fields">
            <div class="field">
              <label for="project">Project</label>
              <select id="project" class="input" required></select>
            </div>
            <div class="field">
              <label for="version">Found in version</label>
              <select id="version" class="input" required></select>
            </div>
            <div class="field" id="platform-field" hidden>
              <label for="platform">Platform</label>
              <select id="platform" class="input"></select>
            </div>
            <div class="field">
              <label for="module">Feature</label>
              <select id="module" class="input" required></select>
            </div>
            <div class="field">
              <label for="severity">Severity</label>
              <select id="severity" class="input"></select>
            </div>
          </div>
          <p id="projects-error" class="notice" hidden></p>
          <div class="form-foot">
            <label class="check small"><input type="checkbox" id="attach-log" checked /> Send network requests and console log</label>
            <span class="small muted" id="log-summary"></span>
          </div>
          <p id="log-missing" class="notice" hidden>
            This page was open before the extension was installed, so no API calls were recorded. Reload the page and
            reproduce the bug to capture them.
          </p>
          <p id="submit-error" class="error" hidden></p>
        </form>

        <section id="done" class="report-form done" hidden>
          <div>
            <p class="done-title">Bug reported</p>
            <p class="small muted" id="done-sub"></p>
          </div>
          <div class="done-links">
            <div class="field">
              <label for="share">Share link</label>
              <div class="copy-row">
                <input id="share" class="input mono small" readonly />
                <button type="button" class="btn btn-primary btn-sm" id="copy-share">Copy</button>
              </div>
            </div>
            <div class="field">
              <label for="fix">Fix it with your AI agent</label>
              <div class="copy-row">
                <input id="fix" class="input mono small" readonly />
                <button type="button" class="btn btn-sm" id="copy-fix">Copy</button>
              </div>
            </div>
          </div>
          <div class="copy-row">
            <a id="open-bug" class="btn" target="_blank" rel="noreferrer">Open in UpTrack</a>
            <button type="button" class="btn" id="close-tab">Close this tab</button>
          </div>
        </section>
      </section>

      <div
        id="resizer"
        class="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize the side panel"
        tabindex="0"
        title="Drag to resize. Double-click to reset."
      ></div>

      <aside class="devtools" aria-label="Captured from the page">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" class="tab" data-tab="page" aria-selected="true" title="The page the bug was captured on">Page</button>
          <button type="button" role="tab" class="tab" data-tab="network" aria-selected="false">Network <span class="count" id="count-network"></span></button>
          <button type="button" role="tab" class="tab" data-tab="console" aria-selected="false">Console <span class="count" id="count-console"></span></button>
        </div>
        <div class="tab-body" id="tab-page" role="tabpanel">
          <dl class="details" id="page-details"></dl>
        </div>
        <div class="tab-body" id="tab-network" role="tabpanel" hidden>
          <div class="tab-tools">
            <input type="search" id="network-filter" class="input filter" placeholder="Filter by URL" aria-label="Filter requests by URL" />
            <label class="check small"><input type="checkbox" id="failed-only" /> Failed only</label>
          </div>
          <div class="chips" id="network-types" role="toolbar" aria-label="Request types"></div>
          <div class="list-head">
            <label class="check small"><input type="checkbox" class="pick" data-kind="network" /> <span id="picked-network"></span></label>
            <span class="small muted">Only ticked requests are sent</span>
          </div>
          <ul class="entries" id="network-list"></ul>
          <p class="small muted empty" id="network-empty" hidden></p>
        </div>
        <div class="tab-body" id="tab-console" role="tabpanel" hidden>
          <div class="list-head">
            <label class="check small"><input type="checkbox" class="pick" data-kind="console" /> <span id="picked-console"></span></label>
            <span class="small muted">Only ticked entries are sent</span>
          </div>
          <ul class="entries" id="console-list"></ul>
          <p class="small muted empty" id="console-empty" hidden></p>
        </div>
      </aside>
    </main>

    <script src="editor.js"></script>
  </body>
</html>
