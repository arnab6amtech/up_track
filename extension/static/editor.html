<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New bug report · UpTrack</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="logo">U</span>
      <strong>New bug report</strong>
      <span id="page-host" class="muted small"></span>
      <div class="topbar-actions">
        <div id="progress" class="progress" hidden><div id="progress-bar"></div></div>
        <button type="submit" form="form" class="btn btn-primary" id="submit">Create bug</button>
      </div>
    </header>

    <main class="layout">
      <section class="report">
        <div class="media">
          <div id="tools" class="toolbar" hidden>
            <div class="group" role="radiogroup" aria-label="Tool">
              <button type="button" class="tool active" data-tool="arrow" title="Draw an arrow (A)">Arrow</button>
              <button type="button" class="tool" data-tool="rect" title="Draw a box (B)">Box</button>
              <button type="button" class="tool" data-tool="text" title="Click to add text (T)">Text</button>
              <button type="button" class="tool" data-tool="blur" title="Hide sensitive information (H)">Blur</button>
            </div>
            <div class="group" role="radiogroup" aria-label="Color" id="colors"></div>
            <div class="group push">
              <button type="button" class="btn btn-sm" id="undo" disabled title="Undo (Ctrl/Cmd+Z)">Undo</button>
              <button type="button" class="btn btn-sm" id="clear" disabled>Clear all</button>
            </div>
          </div>

          <div id="stage" class="stage">
            <div id="canvas-wrap" class="canvas-wrap" hidden>
              <canvas id="canvas"></canvas>
              <textarea id="text-input" class="text-input" rows="1" hidden></textarea>
            </div>
            <video id="video" controls playsinline hidden></video>
            <p id="load-error" class="notice" hidden></p>
          </div>

          <div id="trim" class="trim" hidden>
            <strong class="small">Trim</strong>
            <button type="button" class="btn btn-sm" id="trim-start">Start here</button>
            <span class="mono small" id="trim-label">0:00 to 0:00</span>
            <button type="button" class="btn btn-sm" id="trim-end">End here</button>
            <button type="button" class="btn btn-sm" id="trim-reset">Reset</button>
            <span class="small muted trim-hint">Viewers see this part. The full recording is kept.</span>
          </div>
        </div>

        <form id="form" class="report-form">
          <input id="title" class="title-input" maxlength="300" placeholder="Title: what went wrong?" aria-label="Title" required />
          <textarea
            id="description"
            class="description-input"
            rows="2"
            placeholder="Add a description: steps to reproduce, what you expected, what happened"
            aria-label="Description"
          ></textarea>
          <div class="fields">
            <div class="field">
              <label for="project">Project</label>
              <select id="project" class="input" required></select>
            </div>
            <div class="field">
              <label for="version">Found in version</label>
              <select id="version" class="input" required></select>
            </div>
            <div class="field" id="module-field" hidden>
              <label for="module">Module</label>
              <select id="module" class="input"></select>
            </div>
            <div class="field">
              <label for="severity">Severity</label>
              <select id="severity" class="input"></select>
            </div>
            <div class="field">
              <label for="priority">Priority</label>
              <select id="priority" class="input"></select>
            </div>
          </div>
          <p id="projects-error" class="notice" hidden></p>
          <div class="form-foot">
            <label class="check small"><input type="checkbox" id="attach-log" checked /> Attach API calls and console log</label>
            <span class="small muted" id="log-summary"></span>
          </div>
          <p id="log-missing" class="notice" hidden>
            This page was open before the extension was installed, so no API calls were recorded. Reload the page and
            reproduce the bug to capture them.
          </p>
          <p id="submit-error" class="error" hidden></p>
        </form>

        <section id="done" class="report-form done" hidden>
          <div>
            <p class="done-title">Bug reported</p>
            <p class="small muted" id="done-sub"></p>
          </div>
          <div class="done-links">
            <div class="field">
              <label for="share">Share link</label>
              <div class="copy-row">
                <input id="share" class="input mono small" readonly />
                <button type="button" class="btn btn-primary btn-sm" id="copy-share">Copy</button>
              </div>
            </div>
            <div class="field">
              <label for="fix">Fix it with your AI agent</label>
              <div class="copy-row">
                <input id="fix" class="input mono small" readonly />
                <button type="button" class="btn btn-sm" id="copy-fix">Copy</button>
              </div>
            </div>
          </div>
          <div class="copy-row">
            <a id="open-bug" class="btn" target="_blank" rel="noreferrer">Open in UpTrack</a>
            <button type="button" class="btn" id="close-tab">Close this tab</button>
          </div>
        </section>
      </section>

      <aside class="devtools" aria-label="Captured from the page">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" class="tab" data-tab="page" aria-selected="true">Captured page</button>
          <button type="button" role="tab" class="tab" data-tab="network" aria-selected="false">API calls <span class="count" id="count-network"></span></button>
          <button type="button" role="tab" class="tab" data-tab="console" aria-selected="false">Console log <span class="count" id="count-console"></span></button>
        </div>
        <div class="tab-body" id="tab-page" role="tabpanel">
          <dl class="details" id="page-details"></dl>
        </div>
        <div class="tab-body" id="tab-network" role="tabpanel" hidden>
          <div class="tab-tools">
            <input type="search" id="network-filter" class="input filter" placeholder="Filter by URL" aria-label="Filter API calls by URL" />
            <label class="check small"><input type="checkbox" id="failed-only" /> Failed only</label>
          </div>
          <ul class="entries" id="network-list"></ul>
          <p class="small muted empty" id="network-empty" hidden></p>
        </div>
        <div class="tab-body" id="tab-console" role="tabpanel" hidden>
          <ul class="entries" id="console-list"></ul>
          <p class="small muted empty" id="console-empty" hidden></p>
        </div>
      </aside>
    </main>

    <script src="editor.js"></script>
  </body>
</html>
